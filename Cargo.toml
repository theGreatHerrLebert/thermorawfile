[package]
name = "thermorawfile"
version = "0.1.0"
edition = "2021"
description = "Pure-Rust reader (and, soon, writer) for Thermo Finnigan .raw files — no .NET/DLL"
license = "MIT OR Apache-2.0"

[[bin]]
name = "rawdump"
path = "src/main.rs"

[lib]
name = "thermorawfile"
path = "src/lib.rs"

[workspace]
members = ["thermorawfile-connector"]
# default to the core crate so `cargo test` / `cargo build` don't pull in the
# Python extension-module crate; build that explicitly via maturin.
default-members = ["."]
